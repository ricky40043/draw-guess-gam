services:
  draw-guess:
    build: .
    restart: unless-stopped
    ports:
      - "20941:8083"
    environment:
      PORT: 8083
      FRONTEND_URL: ${FRONTEND_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
